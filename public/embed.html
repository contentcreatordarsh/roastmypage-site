<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Landing Page Roast Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: #faf7f2; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(250, 247, 242, 0.12);
      border-radius: 18px;
      background: #0c0a09;
      padding: 18px;
      box-shadow: 0 18px 50px rgba(12, 10, 9, 0.16);
    }
    .eyebrow {
      margin-bottom: 8px;
      color: rgba(250, 247, 242, 0.48);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 14px;
      color: rgba(250, 247, 242, 0.62);
      font-size: 13px;
      line-height: 1.45;
    }
    form { display: flex; gap: 8px; }
    input {
      min-width: 0;
      flex: 1;
      border: 1px solid rgba(250, 247, 242, 0.14);
      border-radius: 12px;
      background: rgba(250, 247, 242, 0.06);
      color: #fff;
      font: inherit;
      font-size: 14px;
      padding: 12px;
      outline: none;
    }
    input:focus {
      border-color: rgba(232, 93, 4, 0.7);
      box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.18);
    }
    input::placeholder { color: rgba(250, 247, 242, 0.34); }
    button {
      border: 0;
      border-radius: 12px;
      background: #e85d04;
      color: #0c0a09;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 12px 14px;
      white-space: nowrap;
    }
    button:hover { background: #ff6b1a; }
    .error {
      display: none;
      margin-top: 10px;
      color: #fecaca;
      font-size: 12px;
    }
    a {
      display: block;
      margin-top: 12px;
      color: rgba(250, 247, 242, 0.35);
      font-size: 11px;
      text-decoration: none;
    }
    @media (max-width: 420px) {
      form { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Landing page roast widget">
    <div id="agency" class="eyebrow">Agency audit</div>
    <h1>Get a free landing page roast</h1>
    <p>Paste a URL for conversion, SEO, speed, and AI heatmap feedback.</p>
    <form id="roast-form">
      <input id="url-input" type="url" inputmode="url" placeholder="https://yoursite.com" aria-label="Landing page URL" required>
      <button id="cta" type="submit">Roast it</button>
    </form>
    <div id="error" class="error" role="alert">Enter a valid http or https URL.</div>
    <a href="https://roastmypage.site/?embed=1" target="_blank" rel="noopener">Powered by Roast My Landing Page</a>
  </main>
  <script>
    (function () {
      "use strict";

      var APP_ORIGIN = "https://roastmypage.site";
      var params = new URLSearchParams(location.search);

      function cleanText(value, fallback) {
        return String(value || fallback || "").replace(/[<>]/g, "").slice(0, 80);
      }

      function normalizePageUrl(value) {
        var raw = String(value || "").trim();
        if (!raw) return "";
        if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
        try {
          var parsed = new URL(raw);
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return "";
          return parsed.toString();
        } catch (_) {
          return "";
        }
      }

      function buildTarget(pageUrl) {
        var target = new URL("/", APP_ORIGIN);
        target.searchParams.set("embed", "1");
        target.searchParams.set("url", pageUrl);
        return target.toString();
      }

      document.getElementById("agency").textContent = cleanText(params.get("agency"), "Agency audit");
      document.getElementById("cta").textContent = cleanText(params.get("cta"), "Roast it");
      document.getElementById("roast-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var input = document.getElementById("url-input");
        var error = document.getElementById("error");
        var pageUrl = normalizePageUrl(input.value);
        if (!pageUrl) {
          error.style.display = "block";
          input.focus();
          return;
        }
        error.style.display = "none";
        window.open(buildTarget(pageUrl), "_blank", "noopener");
      });
    })();
  </script>
</body>
</html>
